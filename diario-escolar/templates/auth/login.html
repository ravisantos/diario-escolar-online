<html>
  <head>
    <title>Login</title>
  </head>
  <body>

    <link rel="stylesheet" href="diario-escolar/static/css/login.css">

    <h1>DIÁRIO ESCOLAR</h1>

    <h2>Acesse sua conta</h2>

    <div id="formulario-login">
        <form method="post">
            <label for="campo-email">E-mail:</label>
            <input type="email" id="campo-email" name="email" required>
            <br>
            <label for="campo-senha">Senha:</label>
            <input type="password" id="campo-senha" name="senha" required>
            <br>
            <button type="submit">Login</button>
        </form>
    </div>

    <footer id="rodape">
      <p><small>Diário Escolar © 2026<br> Desenvolvido por:
        2º DS</small></p>
    </footer>


  </body>
</html>
