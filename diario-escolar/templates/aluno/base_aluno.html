{% endblock %}

{% block conteudo %}

{% set rota = request.endpoint %}
<aside>

    <a href="{{ url_for('aluno.boletim_rota') }}"    class="{{ 'ativo' if rota == 'aluno.boletim_rota' }}">Boletim</a>

  </nav>
</aside>

  {% block conteudo_aluno %}{% endblock %}
{% endblock %}
