{% extends 'admin/base_admin.html' %}

{% block titulo %}Disciplinas{% endblock %}

{% block conteudo_admin %}
  <h1>Disciplinas</h1>

  <form method="post">
    <label for="nome">Nome da disciplina:</label>
    <input type="text" id="nome" name="nome" required>
    <button type="submit">Criar disciplina</button>
  </form>

  <table>
    <thead>
      <tr><th>Disciplinas</th></tr>
    </thead>
    <tbody>
      {% for disciplina in disciplinas %}
        <tr><td>{{ disciplina.nome }}</td></tr>
      {% else %}
        <tr><td>Nenhuma disciplina cadastrada ainda.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
